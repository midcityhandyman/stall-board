name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Install the package and call the console script
        run: |
          python -m pip install .
          stall-board --help
      - name: Run the offline demo and compare with the captured output
        run: |
          python demo/run_demo.py > /tmp/demo-output.txt
          diff -u demo/output.txt /tmp/demo-output.txt
