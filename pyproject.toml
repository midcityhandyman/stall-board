[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stall-board"
version = "0.1.0"
description = "Work in flight board for a fleet of agents: flags idle, blocked and waiting on a human."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
stall-board = "stall_board.cli:main"

[tool.setuptools]
packages = ["stall_board"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
